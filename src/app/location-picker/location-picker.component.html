<div class="picker-overlay">
    <div class="picker-container">

        <!-- Drag Handle -->
        <div class="drag-handle"></div>

        <!-- Map Area (Hero) -->
        <div class="map-area">

            <!-- Loading state -->
            <div class="map-loading" *ngIf="!googleMapsLoaded">
                <div class="loading-spinner"></div>
                <p>Loading map...</p>
            </div>

            <!-- Google Map -->
            <div id="google-map" [class.map-hidden]="!googleMapsLoaded"></div>

            <!-- Map Hint -->
            <div class="map-hint">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                </svg>
                Drag the pin or tap to set location
            </div>

            <!-- Floating Top Bar (Search + Close) -->
            <div class="top-bar">
                <div class="search-row">
                    <div class="search-wrapper">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input
                            type="text"
                            [(ngModel)]="searchQuery"
                            (ngModelChange)="onSearchInput()"
                            placeholder="Search for a place..."
                            autocomplete="off"
                        />
                    </div>
                    <button class="close-map-btn" (click)="onCancel()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Autocomplete Dropdown -->
                <div class="autocomplete-dropdown" *ngIf="searchResults.length > 0">
                    <div
                        class="autocomplete-item"
                        *ngFor="let result of searchResults"
                        (click)="selectSearchResult(result)"
                    >
                        <div class="place-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                            </svg>
                        </div>
                        <div class="place-details">
                            <span class="place-main">{{ result.mainText }}</span>
                            <span class="place-secondary">{{ result.secondaryText }}</span>
                        </div>
                    </div>
                </div>

                <!-- Searching spinner -->
                <div class="searching-indicator" *ngIf="isSearching">
                    <div class="spinner"></div>
                    <span>Searching...</span>
                </div>
            </div>

            <!-- Floating Action Buttons -->
            <div class="map-actions">
                <button class="locate-btn" (click)="centerOnCurrentLocation()" title="Use my location">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                    </svg>
                </button>
            </div>

        </div>

        <!-- Bottom Address Card -->
        <div class="bottom-card">
            <div class="address-display" *ngIf="selectedAddress">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                </svg>
                <span>{{ selectedAddress }}</span>
            </div>
            <div class="address-display coords-fallback" *ngIf="!selectedAddress">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4M12 16h.01" stroke-linecap="round"/>
                </svg>
                <span>{{ selectedLat | number:'1.4-4' }}, {{ selectedLng | number:'1.4-4' }}</span>
            </div>

            <div class="action-row">
                <button class="cancel-btn" (click)="onCancel()" [disabled]="isConfirming">Cancel</button>
                <button class="confirm-btn" (click)="confirmSelection()" [disabled]="isConfirming || !googleMapsLoaded">
                    <svg *ngIf="!isConfirming" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                    <div *ngIf="isConfirming" class="btn-spinner"></div>
                    <span>{{ isConfirming ? 'Confirming...' : 'Confirm Location' }}</span>
                </button>
            </div>
        </div>

    </div>
</div>
