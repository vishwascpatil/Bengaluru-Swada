<div class="ios-login-layout">

  <!-- Content Container -->
  <div class="login-content">

    <!-- Logo Section -->
    <div class="logo-section">
      <!-- <img src="assets/logo.jpg" alt="Bengaluru Swada Logo" class="app-logo"> -->
    </div>

    <!-- Header -->
    <div class="header-section">
      <h1 class="welcome-title">Bengaluru Swada</h1>
      <p class="subtitle" *ngIf="authMode === 'phone'">Enter your number to start exploring.</p>
      <p class="subtitle" *ngIf="authMode === 'email'">Sign in with your email &amp; password.</p>
    </div>

    <!-- ─── Phone Mode ─── -->
    <div class="auth-section" *ngIf="authMode === 'phone'">
      <div class="input-wrapper">
        <div class="phone-input-group" [class.focused]="isFocused">
          <span class="country-code">+91</span>
          <div class="vertical-divider"></div>
          <input #mobileInput type="tel" id="mobileNumber" placeholder="Mobile Number" maxlength="10" pattern="[0-9]{10}"
            [(ngModel)]="mobile" (input)="onInput()" (focus)="isFocused = true" (blur)="isFocused = false"
            [disabled]="loading" inputmode="numeric" autofocus>
        </div>

        <!-- Error Message -->
        <div class="error-feedback" *ngIf="error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ error }}</span>
        </div>
      </div>

      <div id="recaptcha-container"></div>

      <div class="continue-wrapper">
        <button class="continue-btn" [class.active]="valid && !loading" [disabled]="!valid || loading"
          (click)="continue()">
          <span *ngIf="!loading">Continue</span>
          <div *ngIf="loading" class="spinner-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </button>

        <div class="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Your number is only used for verification</span>
        </div>
      </div>
    </div>

    <!-- ─── Email Mode ─── -->
    <div class="auth-section" *ngIf="authMode === 'email'">
      <div class="input-wrapper">
        <div class="email-input-group">
          <input type="email" placeholder="Email address" [(ngModel)]="email" (input)="onEmailInput()"
            [disabled]="emailLoading" autocomplete="email">
        </div>
        <div class="email-input-group">
          <input type="password" placeholder="Password (min 6 chars)" [(ngModel)]="password" (input)="onEmailInput()"
            [disabled]="emailLoading" autocomplete="current-password">
        </div>

        <div class="email-error" *ngIf="emailError">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ emailError }}</span>
        </div>
      </div>

      <div class="continue-wrapper">
        <button class="continue-btn" [class.active]="emailValid && !emailLoading" [disabled]="!emailValid || emailLoading"
          (click)="signInWithEmail()">
          <span *ngIf="!emailLoading">Sign In / Create Account</span>
          <div *ngIf="emailLoading" class="spinner-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </button>

        <div class="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Your email is kept private &amp; never shared</span>
        </div>
      </div>
    </div>

    <!-- ─── Social Login Buttons (always visible) ─── -->
    <div class="bottom-actions">
      <!-- Divider -->
      <div class="auth-divider">
        <span class="divider-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="divider-line"></span>
      </div>

      <!-- Apple Sign-In -->
      <button class="social-btn social-btn--apple" (click)="signInWithApple()">
        <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="#fff">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-.93 6.02 2.12 5.2l-1.17 2.01zM14.9 2.26c.22-1.3.86-2.26 1.86-2.26.07 1.12-.36 2.18-1.1 2.94-.72.74-1.72 1.17-2.74 1.06-.12-.95.36-2.01 1.06-2.68.44-.44 1.19-.86 1.92-1.06z"/>
        </svg>
        <span>Continue with Apple</span>
      </button>

      <!-- Google Sign-In -->
      <button class="social-btn social-btn--google" (click)="signInWithGoogle()">
        <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Mode switch button -->
      <button class="mode-switch-btn" (click)="authMode === 'phone' ? switchToEmail() : switchToPhone()">
        <svg *ngIf="authMode === 'phone'" class="social-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M22 4L12 13 2 4"/>
        </svg>
        <svg *ngIf="authMode === 'email'" class="social-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 17-4-9-9-4 20-4z"/>
        </svg>
        <span>{{ authMode === 'phone' ? 'Login with Email' : 'Login with OTP' }}</span>
      </button>

    </div>

  </div>
</div>
