<div class="favorites-container">
    <div class="hero-header" *ngIf="showHeader">
        <h1>Favorites</h1>
        <p class="subtitle">Your curated collection of tastes</p>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Loading favorites...</p>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && bookmarkedReels.length === 0">
        <div class="empty-icon-wrapper">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="currentColor"
                    stroke-width="1.5" fill="none" />
            </svg>
        </div>
        <h2>No Favorites Yet</h2>
        <p>Tap the bookmark icon on any reel to save it here</p>
    </div>

    <!-- Results Grid -->
    <div class="results-grid" *ngIf="!isLoading && bookmarkedReels.length > 0">
        <div class="food-card video-card"
            *ngFor="let reel of bookmarkedReels; trackBy: trackByReelId"
            (click)="playReel(reel)">

            <div class="card-image">
                <!--
                  IMPORTANT: muted is set as both an HTML attribute AND enforced
                  via (loadeddata) callback at the DOM property level.
                  autoplay alone is NOT enough on Android WebView — the browser
                  requires muted=true at the property level before play() is called.
                  The IntersectionObserver in the TS controls which video actually plays.
                -->
                <video
                    #videoThumb
                    [src]="reel.videoUrl"
                    muted
                    playsinline
                    webkit-playsinline
                    preload="none"
                    loop
                    [style.opacity]="loadedThumbs.has(reel.id!) ? 1 : 0"
                    (loadeddata)="onThumbLoad(reel.id!, $any($event.target))">
                </video>

                <div class="card-badges">
                    <div class="distance-badge" *ngIf="reel.distanceStr">{{reel.distanceStr}}</div>
                    <div class="rating-badge" *ngIf="reel.rating">
                        {{reel.rating}} <span class="star-mini">★</span>
                    </div>
                </div>
            </div>

            <div class="card-details">
                <div class="header-row">
                    <h3 class="dish-name">{{reel.title}}</h3>
                </div>
                <p class="vendor-name">📍 {{reel.vendor}}</p>
                <div class="price-row">
                    <span class="price">₹{{reel.price}}</span>
                    <span class="taste-tag" *ngIf="reel.categories && reel.categories.length > 0">
                        {{reel.categories[0]}}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
