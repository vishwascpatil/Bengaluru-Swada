<div class="favorites-container">
    <div class="hero-header" *ngIf="showHeader">
        <h1>Favorites</h1>
        <p class="subtitle">Your curated collection of tastes</p>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Loading favorites...</p>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && bookmarkedReels.length === 0">
        <div class="empty-icon-wrapper">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="currentColor"
                    stroke-width="1.5" fill="none" />
            </svg>
        </div>
        <h2>No Favorites Yet</h2>
        <p>Tap the bookmark icon on any reel to save it here</p>
    </div>

    <!-- Results Grid -->
    <div class="results-grid" *ngIf="!isLoading && bookmarkedReels.length > 0">
        <div class="food-card video-card" *ngFor="let reel of bookmarkedReels" (click)="playReel(reel)">
            <div class="card-image">
                <!-- Autoplay looping video like search page -->
                <video [src]="reel.videoUrl" autoplay loop muted playsinline preload="auto" #videoThumb
                    [style.opacity]="loadedThumbs.has(reel.id!) ? 1 : 0" (loadeddata)="onThumbLoad(reel.id!)">
                </video>

                <div class="card-badges">
                    <div class="distance-badge">{{reel.distanceStr}}</div>
                    <div class="rating-badge" *ngIf="reel.rating">
                        {{reel.rating}} <span class="star-mini">★</span>
                    </div>
                </div>
            </div>

            <div class="card-details">
                <div class="header-row">
                    <h3 class="dish-name">{{reel.title}}</h3>
                </div>
                <p class="vendor-name">📍 {{reel.vendor}}</p>
                <div class="price-row">
                    <span class="price">₹{{reel.price}}</span>
                    <span class="taste-tag" *ngIf="reel.categories && reel.categories.length > 0">
                        {{reel.categories[0]}}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
