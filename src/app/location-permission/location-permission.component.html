<div class="permission-container">
  <!-- Dynamic Map Pattern Background -->
  <div class="map-pattern"></div>

  <!-- Decorative blob -->
  <div class="bg-blob"></div>

  <!-- Hero Section -->
  <div class="hero-section">
    <div class="pin-wrapper">
      <div class="pin-ring-bg"></div>
      <img src="assets/food-pin.png" alt="Food Location" class="location-pin-img">
      <div class="pulse-ring ring-1"></div>
      <div class="pulse-ring ring-2"></div>
      <div class="pulse-ring ring-3"></div>
    </div>

    <div class="text-content">
      <span class="badge">Location Required</span>
      <h1>Discover Food<br>Around You</h1>
      <p>Turn on location to find the best local dishes, street food, and hidden gems near your area.</p>
    </div>

    <!-- Action Area -->
    <div class="action-area">
      <button class="primary-btn" (click)="allow()" [disabled]="isFetchingLocation">
        <span class="btn-glow"></span>
        <div class="btn-content">
          <ng-container *ngIf="!isFetchingLocation">
            <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c-2 0-6-4.5-6-10a6 6 0 0 1 12 0c0 5.5-4 10-6 10z"/>
              <circle cx="12" cy="10" r="2.5" fill="currentColor"/>
            </svg>
            <span>Enable Location</span>
          </ng-container>

          <ng-container *ngIf="isFetchingLocation">
            <div class="spinner-small"></div>
            <span>Finding your location...</span>
          </ng-container>
        </div>
      </button>

      <button class="secondary-btn" (click)="manual()" [disabled]="isFetchingLocation">
        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        <span>Choose on Map</span>
      </button>

    </div>
  </div>

  <!-- Location Search Sheet -->
  <app-location-search-sheet
    *ngIf="showLocationModal"
    (closeSheet)="closeLocationModal()"
    (locationSelected)="onLocationSelected()">
  </app-location-search-sheet>
</div>
